name: Figurinha
options:
  bundleIdPrefix: com.seunome
  deploymentTarget:
    iOS: "17.0"
packages:
  SDWebImageWebPCoder:
    url: https://github.com/SDWebImage/SDWebImageWebPCoder
    from: 0.14.6
targets:
  Figurinha:
    type: application
    platform: iOS
    sources: [Figurinha]
    dependencies:
      - package: SDWebImageWebPCoder
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Figurinhas
        UILaunchScreen: {}
        LSApplicationQueriesSchemes: [whatsapp]
        NSMicrophoneUsageDescription: Gravar o áudio da figurinha
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seunome.figurinha
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
